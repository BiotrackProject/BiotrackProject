services:
  migrate:
    image: ghcr.io/biotrackproject/biotrack-api:latest
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    env_file:
      - .env.prod
    restart: "no"

  api:
    image: ghcr.io/biotrackproject/biotrack-api:latest
    expose:
      - "3000"
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    image: ghcr.io/biotrackproject/biotrack-frontend:latest
    expose:
      - "80"
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "8080"
    environment:
      DOZZLE_USERNAME: ${DOZZLE_USERNAME}
      DOZZLE_PASSWORD: ${DOZZLE_PASSWORD}
      DOZZLE_KEY: ${DOZZLE_KEY}
      DOZZLE_BASE: /
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    restart: unless-stopped
    depends_on:
      - api
      - frontend
      - dozzle

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:

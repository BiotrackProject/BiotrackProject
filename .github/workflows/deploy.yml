name: CI / Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a running deploy — queue a second push instead.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ── 1. Type Check & Build ───────────────────────────────────────────────────
  check:
    name: Type Check & Build
    runs-on: [self-hosted, biotrack]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check (API + Frontend)
        run: pnpm typecheck

      - name: Build (API + Frontend)
        run: pnpm build

  # ── 2. Build Docker Images & push to ghcr.io ────────────────────────────────
  images:
    name: Build & Push Docker Images
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute lowercase image prefix
        run: echo "IMG_PREFIX=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.IMG_PREFIX }}/biotrack-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build & push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          tags: ${{ env.IMG_PREFIX }}/biotrack-frontend:latest
          build-args: |
            VITE_API_BASE_URL=https://api.biotrack.org.do
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # ── 3. Deploy to Production ──────────────────────────────────────────────────
  # The self-hosted runner runs ON the server.
  # It pulls the fresh images and restarts containers — no git clone needed.
  deploy:
    name: Deploy to Production
    needs: images
    runs-on: self-hosted
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Copy deploy files to server deploy directory
        run: |
          mkdir -p ~/biotrack
          cp docker-compose.prod.yml ~/biotrack/
          cp Caddyfile ~/biotrack/

      - name: Pull latest images & restart
        run: |
          cd ~/biotrack
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f

      - name: Health check
        run: |
          sleep 15
          docker compose -f ~/biotrack/docker-compose.prod.yml ps

name: Security Scanning

on:
  pull_request:
    branches: [main, dev, qa]
  workflow_dispatch:

jobs:
  zap_scan_frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Zap Scan
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c
        with:
          target: ${{ secrets.ZAP_TARGET_FRONTEND_URL }}
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_action: true

  zap_scan_api:
    runs-on: ubuntu-latest
    # Runs even if the previous job fails, so we can still get the report.
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Zap Scan
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d
        with:
          target: ${{ secrets.ZAP_TARGET_API_URL }}
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"
          token: ${{ secrets.GITHUB_TOKEN }}
          format: openapi
          rules_file_name: "owasp-zap-rules.txt"
          fail_action: true

name: Security Scanning

on:
  pull_request:
    branches: [main, dev, qa]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap_scan_frontend:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Zap Scan
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c
        with:
          target: ${{ secrets.ZAP_TARGET_FRONTEND_URL }}
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_action: true

      - name: Upload ZAP report (frontend)
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: zap-report-frontend
          path: |
            report_json.json
            report_md.md
            report_html.html
          retention-days: 30

  zap_scan_api:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Zap Scan
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d
        with:
          target: ${{ secrets.ZAP_TARGET_API_URL }}
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"
          token: ${{ secrets.GITHUB_TOKEN }}
          format: openapi
          rules_file_name: "owasp-zap-rules.txt"
          fail_action: true

      - name: Upload ZAP report (api)
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: zap-report-api
          path: |
            report_json.json
            report_md.md
            report_html.html
          retention-days: 30